name: flutter_qa_inspector
description: >-
  QA-build inspector that lets testers pick a widget or a whole screen and
  attach its info, BLoC/Cubit state snapshots and a recent state timeline to a
  bug report.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1

dev_dependencies:
  # Tests use MultiBlocObserver, which was added in bloc 9.2.0.
  bloc: ^9.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
