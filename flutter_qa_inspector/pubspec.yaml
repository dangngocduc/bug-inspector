name: flutter_qa_inspector
description: >-
  QA-build inspector that lets testers pick a widget or a whole screen and
  attach its info, BLoC/Cubit state snapshots, a recent state timeline, the
  Dio API calls and an annotated screenshot to a bug report, shared as a ZIP.
version: 0.10.0
publish_to: none

environment:
  # share_plus 12 needs Dart 3.4. CupertinoButton.minimumSize, used by
  # BugReportPage, is in Flutter 3.29.
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  # The ZIP of BugReportBundle.
  archive: ^4.0.0
  # FlutterQaInspector.install uses MultiBlocObserver, added in bloc 9.2.0.
  bloc: ^9.2.0
  # The font of the CupertinoIcons of BugReportPage, the JSON tree and
  # BugNetworkHistoryPage. Declared here, so every host app bundles it.
  cupertino_icons: ^1.0.8
  # BugInspectorDioInterceptor records the API calls of apps that use Dio.
  # Pure Dart: no native code. DioException is in 5.2.0.
  dio: ^5.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  # The share sheet of BugReportPage. 12.x keeps apps that pin it working.
  share_plus: ">=12.0.0 <14.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
