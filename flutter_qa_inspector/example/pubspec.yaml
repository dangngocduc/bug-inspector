name: flutter_qa_inspector_example
description: Demonstrates how to use the flutter_qa_inspector package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # MultiBlocObserver, used in main.dart, was added in bloc 9.2.0.
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  flutter_qa_inspector:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
