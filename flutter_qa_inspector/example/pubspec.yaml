name: flutter_qa_inspector_example
description: Demonstrates how to use the flutter_qa_inspector package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  dio: ^5.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_qa_inspector:
    path: ../
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
